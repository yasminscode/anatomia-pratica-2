<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomia Prática 2 — Ombro e Dorso</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1d2433;--muted:#687386;--accent:#5656cb;--soft:#ededff;--line:#e2e6ef;--green:#137647;--red:#b52e38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:2}.wrap{max-width:980px;margin:auto;padding:17px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.head h1{font-size:22px;margin:0}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}.prog{width:230px}.bar{height:8px;border-radius:20px;background:#e9eaf2;overflow:hidden}.fill{height:100%;background:var(--accent);width:0;transition:.2s}.counter{text-align:right;color:var(--muted);font-size:12px;margin-top:5px}
main{padding:26px 16px 40px}.card,.result{max-width:900px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 28px #202b440c}.photo{background:#eceff5;padding:15px;text-align:center;min-height:160px}.photo img{display:block;max-width:100%;width:auto;height:auto;max-height:440px;object-fit:contain;margin:auto;border-radius:12px}.placeholder{display:none;max-width:520px;margin:auto;border-radius:14px;background:linear-gradient(135deg,#f8e5e5,#dce6f4);padding:42px 20px;color:#5c3841;font-size:18px;font-weight:750}.body{padding:24px}.pill{display:inline-block;background:var(--soft);color:#4141a3;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:750;margin-bottom:10px}.body h2{font-size:20px;margin:0 0 12px}.q{font-size:16px;line-height:1.55;margin:0 0 17px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;text-align:left;font-size:14px;line-height:1.45;cursor:pointer}.option:hover:not(:disabled){border-color:#a3a3ed;background:#fafaff}.option:disabled{cursor:default}.option.correct{background:#edfaf2;border-color:#78c69a}.option.wrong{background:#fff0f0;border-color:#e3a0a0}.feedback{display:none;margin-top:14px;border-radius:12px;padding:13px;font-size:14px;line-height:1.5}.feedback.ok{display:block;background:#edfaf2;color:#12633c}.feedback.bad{display:block;background:#fff0f0;color:#8e252b}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:750;cursor:pointer}.secondary{background:#eef0f6;color:#31394b}.primary{background:var(--accent);color:white}.result{display:none;padding:30px;text-align:center}.result h2{font-size:28px}.score{font-size:46px;font-weight:850;margin:12px}.muted,.note{color:var(--muted)}.note{max-width:900px;margin:15px auto 0;font-size:12px;line-height:1.5;text-align:center}
@media(max-width:650px){.head{align-items:flex-start;flex-direction:column}.prog{width:100%}.body{padding:18px}.photo img{max-height:340px}.actions .btn{flex:1}}
</style></head><body>
<header><div class="wrap head"><div><h1>🧠 Anatomia Prática 2</h1><p>Ombro, dorso e plexo braquial • identificação por número</p></div><div class="prog"><div class="bar"><div class="fill" id="fill"></div></div><div class="counter" id="counter"></div></div></div></header>
<main>
<section class="card" id="quiz"><div class="photo"><img id="pic" alt="Imagem anatômica da estrutura numerada"><div class="placeholder" id="placeholder"></div></div><div class="body">
<div class="pill" id="tag"></div><h2 id="qt"></h2><p class="q" id="question"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div>
<div class="actions"><button class="btn secondary" onclick="restart()">Recomeçar</button><button class="btn primary" id="next" onclick="advance()" style="display:none">Próxima →</button></div></div></section>
<section class="result" id="result"><div class="pill">TREINO CONCLUÍDO</div><h2>Resultado final</h2><div class="score" id="score"></div><p class="muted" id="resultText"></p><button class="btn primary" onclick="restart()">Treinar de novo</button></section>
<p class="note" id="note">Treino baseado nas informações enviadas. Se alguma foto não carregar, confira se a pasta images contém os arquivos correspondentes.</p>
</main>
<script>
const bank=[
{n:1,name:"Músculo deltoide",img:"1_deltoide.jpg",q:"A estrutura de referência é o músculo nº 1. Qual alternativa combina corretamente ORIGEM e INSERÇÃO?",opts:[["Nº 1 — Deltoide. Origem: clavícula, acrômio e espinha da escápula; inserção: tuberosidade deltoidea do úmero.",1],["Nº 1 — Deltoide. Origem: costelas I–IX; inserção: margem medial da escápula.",0],["Nº 1 — Deltoide. Origem: processo coracoide; inserção: olécrano da ulna.",0],["Nº 1 — Deltoide. Origem: sacro e crista ilíaca; inserção: úmero.",0]]},
{n:1,name:"Músculo deltoide",img:"1_deltoide.jpg",q:"A estrutura de referência é o músculo nº 1. Qual alternativa combina corretamente INERVAÇÃO e FUNÇÃO?",opts:[["Nº 1 — Inervação: nervo axilar; função: abdução do braço, além de auxiliar na flexão e extensão conforme as fibras.",1],["Nº 1 — Inervação: nervo torácico longo; função: fixar a escápula ao tórax.",0],["Nº 1 — Inervação: nervo toracodorsal; função: adução e rotação medial do braço.",0],["Nº 1 — Inervação: nervo acessório; função: elevar e retrair a escápula.",0]]},
{n:2,name:"Músculo serrátil anterior",img:"2_serratico.jpg",q:"A estrutura de referência é o músculo nº 2. Qual alternativa combina corretamente ORIGEM e INSERÇÃO?",opts:[["Nº 2 — Serrátil anterior. Origem: faces externas das costelas I a IX; inserção: face anterior da margem medial da escápula.",1],["Nº 2 — Serrátil anterior. Origem: clavícula e acrômio; inserção: tuberosidade deltoidea.",0],["Nº 2 — Serrátil anterior. Origem: linha nucal e processos espinhosos; inserção: clavícula e espinha da escápula.",0],["Nº 2 — Serrátil anterior. Origem: costelas III a V; inserção: processo coracoide.",0]]},
{n:2,name:"Músculo serrátil anterior",img:"2_serratico.jpg",q:"A estrutura de referência é o músculo nº 2. Qual alternativa combina corretamente INERVAÇÃO e FUNÇÃO?",opts:[["Nº 2 — Inervação: nervo torácico longo; função: protração e rotação superior da escápula e fixação dela contra a parede torácica.",1],["Nº 2 — Inervação: nervo axilar; função: abduzir o braço.",0],["Nº 2 — Inervação: nervo acessório; função: elevar o ombro.",0],["Nº 2 — Inervação: nervo toracodorsal; função: estender e aduzir o braço.",0]]},
{n:3,name:"Músculo peitoral menor",img:"3_peitoral_menor.jpg",q:"A estrutura de referência é o músculo nº 3. Qual alternativa combina corretamente ORIGEM e INSERÇÃO?",opts:[["Nº 3 — Peitoral menor. Origem: costelas III a V; inserção: processo coracoide da escápula.",1],["Nº 3 — Peitoral menor. Origem: clavícula, acrômio e espinha da escápula; inserção: úmero.",0],["Nº 3 — Peitoral menor. Origem: costelas I a IX; inserção: margem medial da escápula.",0],["Nº 3 — Peitoral menor. Origem: sacro e crista ilíaca; inserção: úmero.",0]]},
{n:3,name:"Músculo peitoral menor",img:"3_peitoral_menor.jpg",q:"A estrutura de referência é o músculo nº 3. Qual alternativa descreve melhor INERVAÇÃO e FUNÇÃO?",opts:[["Nº 3 — Inervação principalmente pelo nervo peitoral medial; ajuda a estabilizar/deprimir e levar a escápula anteriormente, podendo auxiliar na inspiração forçada quando a escápula está fixa.",1],["Nº 3 — Inervação pelo nervo axilar; realiza abdução do braço.",0],["Nº 3 — Inervação pelo nervo torácico longo; produz protração e rotação superior da escápula.",0],["Nº 3 — Inervação pelo nervo acessório; eleva e retrai a escápula.",0]]},
{n:4,name:"Músculo trapézio",img:"4_trapezio.jpg",q:"A estrutura de referência é o músculo nº 4. Qual alternativa combina corretamente ORIGEM e INSERÇÃO?",opts:[["Nº 4 — Trapézio. Origem: linha nucal superior, protuberância occipital externa e ligamento/processos espinhosos cervicais e torácicos; inserção: clavícula lateral, acrômio e espinha da escápula.",1],["Nº 4 — Trapézio. Origem: costelas I a IX; inserção: margem medial da escápula.",0],["Nº 4 — Trapézio. Origem: clavícula e acrômio; inserção: tuberosidade deltoidea.",0],["Nº 4 — Trapézio. Origem: vértebras toracolombares e crista ilíaca; inserção: úmero.",0]]},
{n:4,name:"Músculo trapézio",img:"4_trapezio.jpg",q:"A estrutura de referência é o músculo nº 4. Qual alternativa combina corretamente INERVAÇÃO e FUNÇÃO?",opts:[["Nº 4 — Inervação motora pelo nervo acessório (XI); eleva, retrai e deprime a escápula e participa de sua rotação superior, conforme as fibras.",1],["Nº 4 — Inervação pelo nervo torácico longo; fixa a escápula ao tórax.",0],["Nº 4 — Inervação pelo nervo toracodorsal; aduz e roda medialmente o braço.",0],["Nº 4 — Inervação pelo nervo axilar; abduz o braço.",0]]},
{n:5,name:"Latíssimo do dorso",img:"5_latissimo.jpg",q:"A estrutura de referência é o músculo nº 5. Qual alternativa combina corretamente ORIGEM e INSERÇÃO?",opts:[["Nº 5 — Latíssimo do dorso. Origem: processos espinhosos torácicos inferiores e lombares por meio da fáscia toracolombar, sacro e crista ilíaca; inserção: assoalho do sulco intertubercular do úmero.",1],["Nº 5 — Latíssimo do dorso. Origem: linha nucal e processos espinhosos cervicais; inserção: acrômio.",0],["Nº 5 — Latíssimo do dorso. Origem: costelas III a V; inserção: processo coracoide.",0],["Nº 5 — Latíssimo do dorso. Origem: clavícula e espinha da escápula; inserção: tuberosidade deltoidea.",0]]},
{n:5,name:"Latíssimo do dorso",img:"5_latissimo.jpg",q:"A estrutura de referência é o músculo nº 5. Qual alternativa combina corretamente INERVAÇÃO e FUNÇÃO?",opts:[["Nº 5 — Inervação: nervo toracodorsal; realiza extensão, adução e rotação medial do braço, além de auxiliar a elevar o tronco quando os membros superiores estão fixos.",1],["Nº 5 — Inervação: nervo acessório; eleva e retrai a escápula.",0],["Nº 5 — Inervação: nervo axilar; abduz o braço.",0],["Nº 5 — Inervação: nervo torácico longo; faz protração escapular.",0]]},
{n:6,name:"Manguito rotador",img:"6_manguito.jpg",q:"A estrutura de referência é o nº 6. Quais músculos formam o manguito rotador?",opts:[["Supraespinal, infraespinal, redondo menor e subescapular.",1],["Deltoide, trapézio, romboide maior e latíssimo do dorso.",0],["Peitoral maior, peitoral menor, serrátil anterior e deltoide.",0],["Bíceps braquial, tríceps braquial, braquial e coracobraquial.",0]]},
{n:6,name:"Manguito rotador",img:"6_manguito.jpg",q:"A estrutura de referência é o nº 6. Qual é a principal função conjunta do manguito rotador?",opts:[["Estabilizar dinamicamente a cabeça do úmero na cavidade glenoidal e auxiliar nos movimentos de rotação; o supraespinal também inicia a abdução.",1],["Estender o cotovelo e estabilizar a articulação do punho.",0],["Protrair a escápula e mantê-la colada à parede torácica.",0],["Elevar a clavícula e produzir flexão do tronco.",0]]},
{n:7,name:"Plexo braquial",img:"7_plexo.jpg",q:"A estrutura de referência é o nº 7. Quais raízes espinhais formam tipicamente o plexo braquial?",opts:[["Ramos anteriores de C5 a T1.",1],["Ramos posteriores de C1 a C4.",0],["Ramos anteriores de T6 a T12.",0],["Nervos cranianos V, VII, IX e X.",0]]},
{n:7,name:"Plexo braquial",img:"7_plexo.jpg",q:"A estrutura de referência é o nº 7. Qual alternativa lista apenas ramos terminais clássicos do plexo braquial?",opts:[["Musculocutâneo, axilar, radial, mediano e ulnar.",1],["Frênico, vago, acessório, hipoglosso e facial.",0],["Femoral, obturatório, tibial, fibular comum e glúteo superior.",0],["Torácico longo, frênico, facial, mediano e femoral.",0]]}
];
let deck=[],i=0,score=0,locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function restart(){deck=shuffle(bank);i=0;score=0;document.getElementById('quiz').style.display='block';document.getElementById('result').style.display='none';render()}
function render(){locked=false;const x=deck[i],pic=document.getElementById('pic'),ph=document.getElementById('placeholder');pic.style.display='block';ph.style.display='none';pic.onerror=()=>{pic.style.display='none';ph.style.display='block';ph.textContent='Imagem do músculo nº '+x.n+' — '+x.name+' (adicione a foto correspondente à pasta images)'};pic.src='images/'+x.img;pic.alt='Referência nº '+x.n+' — '+x.name;document.getElementById('tag').textContent='ESTRUTURA DE REFERÊNCIA Nº '+x.n+' • '+x.name;document.getElementById('qt').textContent='Questão '+(i+1);document.getElementById('question').textContent=x.q;document.getElementById('counter').textContent=(i+1)+' / '+deck.length;document.getElementById('fill').style.width=(i/deck.length*100)+'%';document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';let box=document.getElementById('options');box.innerHTML='';shuffle(x.opts).forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o[0];b.onclick=()=>answer(b,o[1],x);box.appendChild(b)})}
function answer(btn,correct,x){if(locked)return;locked=true;document.querySelectorAll('.option').forEach(b=>b.disabled=true);let fb=document.getElementById('feedback');if(correct){score++;btn.classList.add('correct');fb.className='feedback ok';fb.innerHTML='<strong>✓ Correto!</strong> Boa! Tente também recordar essa resposta sem olhar as alternativas.'}else{btn.classList.add('wrong');let right=x.opts.find(o=>o[1]===1)[0];document.querySelectorAll('.option').forEach(b=>{if(b.textContent===right)b.classList.add('correct')});fb.className='feedback bad';fb.innerHTML='<strong>✗ Quase!</strong> A alternativa verde é a correta. Leia os detalhes e tente lembrar a relação entre estrutura e função.'}document.getElementById('next').style.display='inline-block';document.getElementById('next').textContent=i===deck.length-1?'Ver resultado':'Próxima →'}
function advance(){if(i<deck.length-1){i++;render()}else{document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=score+' / '+deck.length;document.getElementById('resultText').textContent='Você acertou '+Math.round(score/deck.length*100)+'%. Recomece para embaralhar questões e alternativas.';document.getElementById('fill').style.width='100%';document.getElementById('counter').textContent='Concluído'}}
restart();
</script></body></html>
